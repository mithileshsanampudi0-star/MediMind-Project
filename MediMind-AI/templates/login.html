{% extends "base.html" %}

{% block auth_content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">

            <h1>MediMind AI</h1>

            <p>
                Healthcare Intelligence Platform
            </p>

        </div>

        <div class="auth-header">

            <h2>
                Welcome Back
            </h2>

            <p>
                Sign in to access your healthcare dashboard
            </p>

        </div>

        {% if error %}

        <div class="auth-alert">

            {{ error }}

        </div>

        {% endif %}

        <form
            method="POST"
            action="/auth/login"
        >

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="auth-btn"
            >
                Sign In
            </button>

        </form>

        <div class="auth-footer">

            <p>

                Don't have an account?

                <a href="/auth/register">

                    Create Account

                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
