{% extends "base.html" %}

{% block content %}

<div class="dashboard-header">

    <div>

        <h1 class="page-title">
            Medical Profile
        </h1>

        <p class="page-subtitle">
            Personal health information used
            to improve AI recommendations.
        </p>

    </div>

</div>

<div class="card">

    <div class="section-title">
        Patient Information
    </div>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Age
                </label>

                <input
                    type="number"
                    name="age"
                    value="{{ profile.age if profile else '' }}"
                >

            </div>

            <div class="form-group">

                <label>
                    Gender
                </label>

                <select name="gender">

                    <option value="">
                        Select
                    </option>

                    <option
                        value="Male"
                        {% if profile and profile.gender == "Male" %}
                        selected
                        {% endif %}
                    >
                        Male
                    </option>

                    <option
                        value="Female"
                        {% if profile and profile.gender == "Female" %}
                        selected
                        {% endif %}
                    >
                        Female
                    </option>

                    <option
                        value="Other"
                        {% if profile and profile.gender == "Other" %}
                        selected
                        {% endif %}
                    >
                        Other
                    </option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label>
                Blood Group
            </label>

            <select name="blood_group">

                <option value="">
                    Select
                </option>

                {% for bg in [
                    "A+","A-",
                    "B+","B-",
                    "AB+","AB-",
                    "O+","O-"
                ] %}

                <option
                    value="{{ bg }}"
                    {% if profile and profile.blood_group == bg %}
                    selected
                    {% endif %}
                >
                    {{ bg }}
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group">

            <label>
                Allergies
            </label>

            <textarea
                name="allergies"
                rows="4"
            >{{ profile.allergies if profile else '' }}</textarea>

        </div>

        <div class="form-group">

            <label>
                Existing Conditions
            </label>

            <textarea
                name="conditions"
                rows="4"
            >{{ profile.conditions if profile else '' }}</textarea>

        </div>

        <button
            type="submit"
            class="btn"
        >
            Save Medical Profile
        </button>

    </form>

</div>

{% endblock %}
