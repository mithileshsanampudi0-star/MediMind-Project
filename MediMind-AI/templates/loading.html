{% extends "base.html" %}

{% block content %}

<div class="loading-page">

    <div class="loading-card">

        <div class="ai-brain">

            <div class="brain-core"></div>

        </div>

        <h1>
            MediMind AI Analysis
        </h1>

        <p>
            Processing healthcare information
        </p>

        <div class="progress-container">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

        <div
            id="progressPercent"
            class="progress-percent"
        >
            0%
        </div>

        <div
            id="currentStep"
            class="current-step"
        >
            Initializing...
        </div>

        <div class="pipeline-list">

            <div
                class="pipeline-item"
                id="step1"
            >
                Extracting Symptoms
            </div>

            <div
                class="pipeline-item"
                id="step2"
            >
                Predicting Diseases
            </div>

            <div
                class="pipeline-item"
                id="step3"
            >
                Assessing Risk
            </div>

            <div
                class="pipeline-item"
                id="step4"
            >
                Detecting Emergencies
            </div>

            <div
                class="pipeline-item"
                id="step5"
            >
                Recommending Specialist
            </div>

            <div
                class="pipeline-item"
                id="step6"
            >
                Generating Report
            </div>

        </div>

    </div>

</div>

<script
src="{{ url_for(
'static',
filename='js/loading.js'
) }}"
></script>

{% endblock %}
